<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aura Expense Tracker</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      padding:20px;
    }

    .container{
      max-width:500px;
      margin:auto;
    }

    .title{
      text-align:center;
      font-size:35px;
      margin-bottom:20px;
      color:#38bdf8;
      font-weight:bold;
    }

    .top-card{
      background:linear-gradient(135deg,#2563eb,#38bdf8);
      padding:25px;
      border-radius:25px;
      text-align:center;
      margin-bottom:20px;
    }

    .top-card h3{
      margin-bottom:10px;
      font-size:18px;
    }

    .top-card h1{
      font-size:45px;
    }

    .filter-buttons{
      display:flex;
      gap:10px;
      margin-top:15px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .filter-buttons button{
      width:auto;
      padding:8px 15px;
      border:none;
      border-radius:10px;
      background:white;
      color:#2563eb;
      font-weight:bold;
      cursor:pointer;
    }

    .card{
      background:#1e293b;
      padding:20px;
      border-radius:20px;
      margin-bottom:20px;
    }

    input,select{
      width:100%;
      padding:12px;
      margin-top:12px;
      border:none;
      border-radius:10px;
      outline:none;
      font-size:16px;
    }

    button{
      width:100%;
      padding:13px;
      margin-top:15px;
      border:none;
      border-radius:12px;
      background:#38bdf8;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .expense-item{
      background:#334155;
      padding:15px;
      border-radius:15px;
      margin-top:15px;

      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .expense-item h4{
      margin-bottom:5px;
    }

    .category{
      font-size:13px;
      color:#cbd5e1;
    }

    .datetime{
      font-size:12px;
      color:#94a3b8;
      margin-top:5px;
    }

    .amount{
      color:#f87171;
      font-size:18px;
      font-weight:bold;
    }

    .delete-btn{
      background:red;
      border:none;
      color:white;
      padding:6px 10px;
      border-radius:8px;
      margin-top:8px;
      cursor:pointer;
      width:auto;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="title">
    Aura Expense 💸
  </div>

  <!-- TOP TOTAL -->

  <div class="top-card">

    <h3 id="filterTitle">
      Total Expenses
    </h3>

    <h1 id="totalAmount">
      ₹0
    </h1>

    <!-- FILTER BUTTONS -->

    <div class="filter-buttons">

      <button onclick="setFilter('daily')">
        Daily
      </button>

      <button onclick="setFilter('monthly')">
        Monthly
      </button>

      <button onclick="setFilter('yearly')">
        Yearly
      </button>

      <button onclick="setFilter('all')">
        All
      </button>

    </div>

  </div>

  <!-- ADD EXPENSE -->

  <div class="card">

    <input
      type="text"
      id="title"
      placeholder="Expense title"
    >

    <input
      type="number"
      id="amount"
      placeholder="Expense amount"
    >

    <select id="category">

      <option>Food</option>
      <option>Travel</option>
      <option>Shopping</option>
      <option>Study</option>
      <option>Other</option>

    </select>

    <button onclick="addExpense()">
      Add Expense
    </button>

  </div>

  <!-- HISTORY -->

  <div class="card">

    <h2>Expense History</h2>

    <div id="expenseList"></div>

  </div>

</div>

<script>

  let expenses =
    JSON.parse(localStorage.getItem("expenses")) || [];

  let currentFilter = "all";

  function saveData(){

    localStorage.setItem(
      "expenses",
      JSON.stringify(expenses)
    );

  }

  function setFilter(filter){

    currentFilter = filter;

    renderExpenses();

  }

  function renderExpenses(){

    let expenseList =
      document.getElementById("expenseList");

    let totalAmount =
      document.getElementById("totalAmount");

    let filterTitle =
      document.getElementById("filterTitle");

    expenseList.innerHTML = "";

    let total = 0;

    let now = new Date();

    expenses.forEach((expense,index)=>{

      let expenseDate = new Date(expense.date);

      let show = false;

      if(currentFilter === "daily"){

        show =
          expenseDate.toDateString() ===
          now.toDateString();

        filterTitle.innerText =
          "Today's Expenses";

      }

      else if(currentFilter === "monthly"){

        show =
          expenseDate.getMonth() === now.getMonth()
          &&
          expenseDate.getFullYear() === now.getFullYear();

        filterTitle.innerText =
          "Monthly Expenses";

      }

      else if(currentFilter === "yearly"){

        show =
          expenseDate.getFullYear() ===
          now.getFullYear();

        filterTitle.innerText =
          "Yearly Expenses";

      }

      else{

        show = true;

        filterTitle.innerText =
          "Total Expenses";

      }

      if(show){

        total += Number(expense.amount);

        expenseList.innerHTML += `

          <div class="expense-item">

            <div>

              <h4>${expense.title}</h4>

              <div class="category">
                ${expense.category}
              </div>

              <div class="datetime">
                ${expense.date}
              </div>

            </div>

            <div align="right">

              <div class="amount">
                ₹${expense.amount}
              </div>

              <button
                class="delete-btn"
                onclick="deleteExpense(${index})"
              >
                Delete
              </button>

            </div>

          </div>

        `;

      }

    });

    totalAmount.innerText = "₹" + total;

  }

  function addExpense(){

    let title =
      document.getElementById("title").value;

    let amount =
      document.getElementById("amount").value;

    let category =
      document.getElementById("category").value;

    if(title === "" || amount === ""){

      alert("Please fill all fields");

      return;

    }

    let now = new Date();

    let formattedDate =
      now.toLocaleDateString() +
      " " +
      now.toLocaleTimeString();

    expenses.push({

      title,
      amount,
      category,
      date: formattedDate

    });

    saveData();

    renderExpenses();

    document.getElementById("title").value = "";
    document.getElementById("amount").value = "";

  }

  function deleteExpense(index){

    expenses.splice(index,1);

    saveData();

    renderExpenses();

  }

  renderExpenses();

</script>

</body>
</html>
