<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aura Expense Tracker</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      padding:20px;
    }

    .container{
      max-width:450px;
      margin:auto;
    }

    .app-title{
      text-align:center;
      font-size:32px;
      color:#38bdf8;
      margin-bottom:20px;
      font-weight:bold;
    }

    /* TOP TOTAL SECTION */

    .top-balance{
      background:linear-gradient(135deg,#38bdf8,#2563eb);
      padding:25px;
      border-radius:25px;
      text-align:center;
      margin-bottom:20px;
      box-shadow:0 0 15px rgba(0,0,0,0.4);
    }

    .top-balance h3{
      font-size:18px;
      margin-bottom:10px;
      opacity:0.9;
    }

    .top-balance h1{
      font-size:45px;
    }

    .card{
      background:#1e293b;
      padding:20px;
      border-radius:20px;
      margin-bottom:20px;
      box-shadow:0 0 10px rgba(0,0,0,0.3);
    }

    input, select{
      width:100%;
      padding:12px;
      margin-top:12px;
      border:none;
      border-radius:10px;
      outline:none;
      font-size:16px;
    }

    button{
      width:100%;
      padding:13px;
      margin-top:15px;
      border:none;
      border-radius:12px;
      background:#38bdf8;
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      background:#0ea5e9;
    }

    .expense-item{
      background:#334155;
      padding:15px;
      border-radius:15px;
      margin-top:12px;

      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .expense-item h4{
      margin-bottom:5px;
    }

    .category{
      color:#cbd5e1;
      font-size:13px;
    }

    .amount{
      color:#f87171;
      font-weight:bold;
      font-size:18px;
    }

    .delete-btn{
      margin-top:8px;
      background:red;
      padding:5px 10px;
      border:none;
      border-radius:7px;
      color:white;
      cursor:pointer;
      width:auto;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="app-title">
      Aura Expense 💸
    </div>

    <!-- TOP TOTAL AMOUNT -->

    <div class="top-balance">
      <h3>Total Expenses</h3>
      <h1 id="totalAmount">₹0</h1>
    </div>

    <!-- ADD EXPENSE -->

    <div class="card">

      <input
        type="text"
        id="title"
        placeholder="Enter expense title"
      >

      <input
        type="number"
        id="amount"
        placeholder="Enter amount"
      >

      <select id="category">
        <option>Food</option>
        <option>Travel</option>
        <option>Shopping</option>
        <option>Study</option>
        <option>Other</option>
      </select>

      <button onclick="addExpense()">
        Add Expense
      </button>

    </div>

    <!-- HISTORY -->

    <div class="card">

      <h2>Expense History</h2>

      <div id="expenseList"></div>

    </div>

  </div>

  <script>

    let expenses =
      JSON.parse(localStorage.getItem("expenses")) || [];

    function saveData(){

      localStorage.setItem(
        "expenses",
        JSON.stringify(expenses)
      );

    }

    function renderExpenses(){

      let expenseList =
        document.getElementById("expenseList");

      let totalAmount =
        document.getElementById("totalAmount");

      expenseList.innerHTML = "";

      let total = 0;

      expenses.forEach((expense,index)=>{

        total += Number(expense.amount);

        expenseList.innerHTML += `

          <div class="expense-item">

            <div>
              <h4>${expense.title}</h4>

              <p class="category">
                ${expense.category}
              </p>
            </div>

            <div align="right">

              <div class="amount">
                ₹${expense.amount}
              </div>

              <button
                class="delete-btn"
                onclick="deleteExpense(${index})"
              >
                Delete
              </button>

            </div>

          </div>

        `;

      });

      totalAmount.innerText = "₹" + total;

    }

    function addExpense(){

      let title =
        document.getElementById("title").value;

      let amount =
        document.getElementById("amount").value;

      let category =
        document.getElementById("category").value;

      if(title === "" || amount === ""){

        alert("Please fill all fields");

        return;

      }

      expenses.push({
        title,
        amount,
        category
      });

      saveData();

      renderExpenses();

      document.getElementById("title").value = "";
      document.getElementById("amount").value = "";

    }

    function deleteExpense(index){

      expenses.splice(index,1);

      saveData();

      renderExpenses();

    }

    renderExpenses();

  </script>

</body>
</html>
